[project]
name = "traffic-video-analytics-foundation"
version = "0.1.0"
description = "Milestone 0-1 foundation for auditable traffic video analytics."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "tzdata==2025.2"
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.4"
]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["apps/backend", "apps/worker"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
