name: Foundation CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_public_release.py --json
      - run: python scripts/check_design_system.py
      - run: python scripts/check_localization.py
      - run: python scripts/check_model_registry.py
      - run: python -m compileall -q apps tools scripts tests
      - run: python -m pytest tests/backend
      - run: python scripts/export_openapi.py
      - run: python scripts/generate_ts_client.py
      - run: git diff --exit-code -- packages/contracts/openapi.json apps/frontend/src/api/generated.ts

  frontend:
    name: frontend (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: pnpm install --frozen-lockfile
      - name: Use Node 24 for Playwright browser install
        if: matrix.node-version == '26'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm exec playwright install chromium
      - name: Restore matrix Node
        if: matrix.node-version == '26'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm run build:frontend
      - run: pnpm run test:frontend
      - run: pnpm run test:e2e
